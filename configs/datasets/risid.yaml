# RiSID v2 -- River Surface Image Dataset, Kataoka et al., Data in Brief 63 (2025)
# Zenodo 10.5281/zenodo.16927238, CC BY 4.0, 7356 images, 11 sites / 7 Japanese rivers.
#
# Bulk supplier of debris masks, captured during flood season. Nadir view from
# bridge rails -- deliberately kept despite the perspective mismatch, because
# Phase 2 site data is what the model gets fine-tuned on (docs/datasets.md s9.3).

dataset: risid
adapter: coco_polygon

paths:
  # VERIFIED after unzipping on 2026-08-18: images.zip expands to a single
  # `images/` directory holding all 7356 PNGs, so the path is unz/images, not
  # images. The annotation JSONs download beside the archive rather than inside
  # it, so that one stays at the dataset root.
  images: unz/images
  # 2-category file: the schema merges everything into `debris` anyway.
  annotations: annotations_2cat.json

# `non_pla` is mostly wood and vegetation. Under the `debris` schema that is
# in-class, not background -- decision 1 in docs/datasets.md s9, and the whole
# reason the class was renamed from `trash`.
#
# VERIFIED against the real annotations_2cat.json on 2026-08-18, and the original
# setting was WRONG. The file declares `categories: [(1, 'pla'), (2, 'non_pla')]`,
# not the "Plastics"/"Non-plastics" spelled out in the paper. With
# `unmapped: error` that mismatch would have aborted conversion on the first
# annotation, and coco_polygon.py validates paint_order against the real category
# names too -- both loud failures, which is exactly what those settings are for.
label_map:
  pla: debris
  non_pla: debris
unmapped: error

paint_order:
  - non_pla
  - pla

# VERIFIED against the real filenames on 2026-08-15, and the original setting was
# WRONG. Files are named "<video>_<frame>_<n>.png", e.g.
#   20221007124922_d.flv20221007124922_d_001255_6_0.png
# `stem_prefix` strips only the last token, which left 7332 groups for 7356
# images -- group-aware splitting became a no-op. Meanwhile 90.5% of adjacent
# frame pairs within a video sit under 10 frames apart, so near-duplicate frames
# would have landed in train and val simultaneously and inflated every metric.
#
# The regex captures everything before the frame counter, giving 279 real video
# groups (mean 26 images each, largest 337).
group_from: regex
group_regex: '^(.*?)_\d{5,}_'
water_source: pseudo_pending

pseudolabel:
  ring_dilate: 25
  n_seeds: 8
  negative_top_frac: 0.0       # nadir view: no sky band to mark as negative
  min_water_frac: 0.30         # a nadir river surface should be mostly water
  max_water_frac: 0.999
  min_sam_score: 0.80
  seed: 1337

clump:
  enabled: true
  min_area_frac: 0.005
  close_kernel: 5

max_size: 1024
# Largest dataset by far (~7k of ~15k images). Down-weighted so the mix is not
# simply "train on Japanese nadir footage" -- see docs/datasets.md s6 Sampling.
sampling_weight: 0.5
