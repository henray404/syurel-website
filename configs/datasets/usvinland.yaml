# USVInland -- water segmentation subset. Cheng et al., arXiv 2103.05383.
# https://github.com/ORCA-Uboat/USVInland-Dataset
#
# Turbid inland canal water: appearance-wise the closest public match to a
# tropical river. USV perspective, and the water labels ship inside a large
# multi-sensor bundle -- extract only the water-segmentation part into
# data/raw/usvinland/ and ignore the lidar/radar/GPS payload.

dataset: usvinland
adapter: semantic_png

paths:
  images: images
  masks: masks
recursive: true
mask_suffix: .png

# Binary water masks: 0 = not water, 255 = water is the common encoding.
# VERIFY after extraction -- if it is 0/1, change the key below to 1.
id_to_label:
  255: water

label_map:
  water: water
unmapped: error

group_from: parent
water_source: none

clump:
  enabled: false

max_size: 1024
sampling_weight: 0.6
