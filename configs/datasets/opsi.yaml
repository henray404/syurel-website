# Own Roboflow project (workspace "hengray", project "OPSI"), pulled via
# `python scripts/download.py --dataset opsi_roboflow` (needs ROBOFLOW_API_KEY,
# see .env.example). Export format is coco-segmentation, so this reuses the
# coco_polygon adapter -- no new adapter code needed.
#
# Export the Roboflow version at 100% train split: src/data/splits.py already
# re-splits group-aware, so Roboflow's own train/valid/test folders would only
# add a merge step for nothing. If the download instead lands multiple split
# folders, point `paths` at the `train/` one and ignore the rest.

dataset: opsi
adapter: coco_polygon

paths:
  images: train
  annotations: train/_annotations.coco.json

# VERIFY against the real _annotations.coco.json after the first download --
# category names depend on what was typed into Roboflow's label list.
# `unmapped: error` will list anything missed here.
label_map:
  water: water
  debris: debris
  clump: clump
unmapped: error

recursive_images: false
group_from: flat
water_source: labelled

paint_order:
  - water
  - debris
  - clump

clump:
  enabled: true
  min_area_frac: 0.005
  close_kernel: 5

max_size: 1024
sampling_weight: 1.0
