# Own Roboflow project (workspace "hengray", project "OPSI"), pulled via
# `python scripts/download.py --dataset opsi_roboflow` (needs ROBOFLOW_API_KEY,
# see .env.example). Export format is coco-segmentation, so this reuses the
# coco_polygon adapter -- no new adapter code needed.
#
# Export the Roboflow version at 100% train split: src/data/splits.py already
# re-splits group-aware, so Roboflow's own train/valid/test folders would only
# add a merge step for nothing. If the download instead lands multiple split
# folders, point `paths` at the `train/` one and ignore the rest.

dataset: opsi
adapter: coco_polygon

# The version-1 export put all 33 frames in `test`, not `train`: they are a
# held-out in-domain evaluation set, not training data.
paths:
  images: test
  annotations: test/_annotations.coco.json

# VERIFIED against the real _annotations.coco.json (2026-08-30). The labels were
# typed in Indonesian, and Roboflow adds the project name itself as category 0
# with no annotations attached -- it still has to be mapped or `unmapped: error`
# trips on it.
label_map:
  air: water
  sampah: debris
  OPSI: background
unmapped: error

recursive_images: false
group_from: flat
water_source: labelled

# Source label names, not target ones. Later wins: rubbish sitting on water is
# debris, not water.
paint_order:
  - air
  - sampah

clump:
  enabled: true
  min_area_frac: 0.005
  close_kernel: 5

max_size: 1024
sampling_weight: 1.0
