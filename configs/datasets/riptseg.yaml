# RIPTSeg -- "Dataset of trash and water segmentations in riverine environments"
# 4TU.ResearchData, The Ocean Cleanup, CC BY 4.0, ~300 images, 6 locations.
# https://data.4tu.nl/datasets/90d13261-b0fe-444a-b408-c5a63db3d887
#
# The anchor dataset: the ONLY source with ground-truth water, which makes it the
# yardstick for scoring the SAM water pseudo-labeller used on everything else.

dataset: riptseg
adapter: coco_polygon

paths:
  images: unz/paper_dataset/images
  annotations: unz/paper_dataset/annotations/all_annotations.json

# VERIFIED against the real all_annotations.json on 2026-08-13.
# Category ids 1..4: floating_trash_in_system (2322 anns),
# floating_trash_outside_system (448), water (747), barrier (870). 4387 total,
# which matches the figure quoted in docs/datasets.md.
label_map:
  water: water
  barrier: background          # structure is a config polygon at inference, not a class
  floating_trash_in_system: debris
  floating_trash_outside_system: debris
unmapped: error

# MEASURED: only ~20.6% of each frame is annotated (range 14.6-22.6%) -- RIPTSeg
# labels a fixed region around the barrier, not the whole image. Water is just 17%
# of frame pixels, which is impossible for river footage, so the unannotated 80%
# demonstrably contains real water and debris. Calling it `background` would train
# the model that river water is background and corrupt the coverage denominator.
unlabelled: ignore

# Later entries win on overlap. Debris last: a bottle on water is debris.
paint_order:
  - water
  - barrier
  - floating_trash_in_system
  - floating_trash_outside_system

# file_name in the COCO JSON is a bare basename while images live in
# images/loc1..loc6/, so the basename index is required -- without it every image
# fails to resolve. Basenames verified unique across all 300.
recursive_images: true
group_from: parent             # loc1..loc6 directories, 50 images each
water_source: labelled

clump:
  enabled: true
  min_area_frac: 0.005
  close_kernel: 5

max_size: 1024
sampling_weight: 1.0
